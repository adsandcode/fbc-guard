name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run selftest
      - run: node dist/cli.js --selftest
      - run: node scripts/smoke.mjs
      - run: node scripts/check-publish-ready.mjs
